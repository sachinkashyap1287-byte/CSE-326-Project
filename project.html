<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paws & Claws Pet Care</title>
  <!--CSS-->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    body {
      background-color: #fcfaf7;
      color: #3c332a;
      line-height: 1;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: 40px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      border: 1px solid #f0e6dc;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header .logo {
      font-size: 3rem;
      margin-bottom: 10px;
      display: inline-block;
    }

    .header h1 {
      font-size: 1.8rem;
      color: #2b1d0c;
      font-weight: 700;
    }

    .header p {
      color: #7d7063;
      margin-top: 5px;
      font-size: 1rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #4a3e31;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 2px solid #ebdcd0;
      border-radius: 12px;
      font-size: 1rem;
      background-color: #fdfdfd;
      transition: all 0.2s ease;
      color: #3c332a;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #d4a373;
      background-color: #fff;
    }

    .btn {
      width: 100%;
      background-color: #d4a373;
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
  </style>
</head>
<body>
	<!--HTML-->
  <div class="container">
    
    <header class="header">
      <span class="logo"></span>
      <h1>Paws & Claws</h1>
      <p>Book a cozy spot for your furry best friend</p>
    </header>

    <form id="bookingForm">
      <div class="form-group">
        <label for="petName">What is your pet's name?</label>
        <input type="text" id="petName" >
      </div>

        <div class="form-group">
          <label for="petType">What kind of animal?</label>
          <select id="petType" required>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Bird">Bird</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="service">Choose a service</label>
          <select id="service" required>
            <option value="Grooming">Bath & Haircut</option>
            <option value="Checkup">Routine Vet Visit</option>
            <option value="Spa">Daycare & Play</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Pick a day</label>
          <input type="date" id="date">
        </div>

        <div class="form-group">
          <label for="time">Pick a time</label>
          <input type="time" id="time">
        </div>

      <div class="form-group">
        <label for="ownerContact">Your phone number or email</label>
        <input type="text" id="ownerContact">
      </div>

      <button type="submit" class="btn" onclick="alert('Your Appointment has been registered.')">Book Appointment</button>
    </form>

  </div>

</body>
</html>
